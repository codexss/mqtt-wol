[dependencies]
# v0.24.0 中，关闭默认特性会去掉 rustls，
# 但为了保持异步功能正常，我们需要确保 tokio 侧开启了必要特性。
rumqttc = { version = "0.24.0", default-features = false } 
wakey = "0.3.0"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true